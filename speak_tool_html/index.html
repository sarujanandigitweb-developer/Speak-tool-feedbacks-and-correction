<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Tool — Unit 3 Lampshade</title>
<style>
      /* One accent, everything else neutral. Spacing and type do the work. */
      :root{
        --bg:#F4F6F8; --card:#FFFFFF; --sunk:#EDF1F4;
        --ink:#1B2733; --ink-2:#5C6B7A; --ink-3:#8595A4;
        --line:#DFE5EB; --line-2:#C8D2DB;
        --accent:#0F6E76; --accent-soft:#E4F0F1; --accent-ink:#0B5158;
        --alert:#A6402F; --alert-soft:#FBECE9;
        --ok:#1F7A4D; --ok-soft:#E8F3ED;
        --r:6px;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0; padding:0; background:var(--bg); color:var(--ink); overflow:hidden;
        font-family:var(--sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
      /* The packer must never scroll to find the count. The shell is exactly one
         screen tall; the fixed bars keep their size and the order card takes
         whatever height is left, with the picture scaling to fit it. */
      /* max-width was the binding constraint: on a wide monitor the dialog was
         full width but the content stopped at 1760px and sat between two grey
         gutters. 2400 is past any station monitor, so the shell now simply fills
         whatever width the dialog is given, and the side padding is trimmed. */
      /* No side padding. Google's dialog already draws its own margin around the
         iframe, so anything here is width the order card never gets. The panels
         carry their own borders, so they still read as separate blocks. */
      .shell{max-width:2400px; height:100%; margin:0 auto; padding:8px 0 10px;
        display:flex; flex-direction:column; gap:9px;}

      .topbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 26px; flex:none;
        background:var(--card); border:1px solid var(--line); border-radius:var(--r);
        padding:9px 16px;}
      .pos{display:flex; align-items:baseline; gap:10px}
      .pos-row{font-size:22px; font-weight:650; letter-spacing:-.01em}
      .pos-item{font-family:var(--mono); font-size:13.5px; font-variant-numeric:tabular-nums;
        color:var(--accent-ink); background:var(--accent-soft); padding:3px 9px; border-radius:99px; white-space:nowrap;}
      .clocks{display:flex; gap:20px; margin-left:auto}
      .clock{display:flex; flex-direction:column; gap:1px}
      .clock-lab{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
      .clock-val{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink-2)}

      .audio{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 18px;
        padding-left:18px; border-left:1px solid var(--line);}
      .field{display:flex; flex-direction:column; gap:4px; min-width:0}
      .field label{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
      .field select{font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--card);
        border:1px solid var(--line-2); border-radius:5px; padding:6px 10px; max-width:250px; cursor:pointer;}
      .field select:hover{border-color:var(--ink-3)}
      .field select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
      .seg{display:flex; border:1px solid var(--line-2); border-radius:5px; overflow:hidden}
      .seg button{font-family:var(--sans); font-size:14px; color:var(--ink-2); background:var(--card);
        border:0; border-right:1px solid var(--line); padding:7px 12px; cursor:pointer; margin:0;}
      .seg button:last-child{border-right:0}
      .seg button:hover{background:var(--sunk)}
      .seg button[aria-pressed="true"]{background:var(--accent); color:#fff}

      .controls{display:flex; flex-wrap:wrap; align-items:center; gap:8px; flex:none;
        background:var(--card); border:1px solid var(--line); border-radius:var(--r);
        padding:9px 16px;}
      button{font-family:var(--sans); font-size:15px; font-weight:500; color:var(--ink); background:var(--card);
        border:1px solid var(--line-2); border-radius:5px; padding:10px 17px; cursor:pointer; margin:0;
        display:inline-flex; align-items:center; gap:7px;}
      .ico{font-size:16px; line-height:1}
      button:hover{background:var(--sunk); border-color:var(--ink-3)}
      button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
      button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
      button.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
      #pauseBtn.is-paused{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:600}
      .spacer{margin-left:auto}

      .mic-wrap{display:flex; align-items:center; gap:10px}
      #micIndicator{display:inline-flex; align-items:center; gap:8px; padding:6px 13px; border-radius:99px;
        font-size:14px; font-weight:500; border:1px solid var(--line-2); background:var(--card); color:var(--ink-2);}
      #micIndicator .mic-dot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:none}
      #micIndicator.mic-listening,#micIndicator.mic-hearing{border-color:var(--ok); color:var(--ok); background:var(--ok-soft)}
      #micIndicator.mic-listening .mic-dot{background:var(--ok); animation:pulse 1.5s ease-in-out infinite}
      #micIndicator.mic-hearing .mic-dot{background:var(--ok); animation:pulse .55s ease-in-out infinite}
      #micIndicator.mic-processing,#micIndicator.mic-speaking{color:var(--ink-3)}
      #micIndicator.mic-paused{border-color:var(--line-2); color:var(--ink-2); background:var(--sunk)}
      #micIndicator.mic-error{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
      #micIndicator.mic-error .mic-dot{background:var(--alert)}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      #micBtn.mic-off{background:var(--sunk)}

      #spokenText{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
        border-radius:var(--r); padding:11px 16px; flex:none;
        font-size:19px; font-weight:600; letter-spacing:-.005em;}
      #voiceFeedback{display:none}

      .combo-images{display:flex; gap:12px; overflow-x:auto; overflow-y:hidden; padding:11px; flex:none;
        background:var(--card); border:1px solid var(--line); border-radius:var(--r);}
      .combo-images:empty{display:none}
      /* Each thumbnail carries its position, so "item 3 of 7" in the header and
         the third picture in the strip are obviously the same thing. */
      .thumb{position:relative; flex:none}
      .thumb img{height:clamp(62px,9vh,128px); width:clamp(62px,9vh,128px); object-fit:contain;
        display:block; background:var(--card);
        border:2px solid var(--line-2); border-radius:8px; padding:7px; cursor:pointer;}
      .thumb img:hover{border-color:var(--accent)}
      .thumb.on img{border-color:var(--accent); border-width:4px; padding:6px}
      .thumb-badge{position:absolute; top:-9px; left:-9px; min-width:32px; height:32px; padding:0 8px;
        border-radius:99px; background:var(--ink); color:#fff; font-size:17px; font-weight:700;
        display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
        border:3px solid var(--card);}
      .thumb.on .thumb-badge{background:var(--accent)}

      #display{flex:1; min-height:0; display:flex; overflow:auto}
      /* Top padding is 2 spacing units (8px each) above the previous 16px, so the
         TITLE label and the product picture no longer start hard against the
         card's top edge. */
      .ordercard{flex:1; min-height:0; display:flex; flex-direction:column;
        background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:32px 16px 12px;}
      .oc-grid{flex:1; min-height:0; display:grid; grid-template-columns:1fr auto 1fr;
        gap:20px; align-items:stretch;}
      @media(max-width:1100px){.oc-grid{grid-template-columns:1fr; gap:16px}}
      .oc-lab{font-size:13px; letter-spacing:.09em; text-transform:uppercase;
        color:var(--ink-3); font-weight:600; margin:0 0 5px}
      .oc-title{font-size:19px; color:var(--ink); font-weight:500; margin:0 0 12px; line-height:1.35}
      .oc-name{font-size:clamp(19px,2.6vh,26px); font-weight:650; letter-spacing:-.015em;
        margin:0 0 10px; line-height:1.25}
      .oc-chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px}
      .chip{font-size:13.5px; font-weight:500; padding:5px 13px; border-radius:99px;
        background:var(--sunk); color:var(--ink-2); border:1px solid var(--line);}
      .chip-alert{background:var(--alert-soft); color:var(--alert); border-color:var(--alert)}
      .oc-status{font-size:20px; font-weight:650; color:var(--alert); margin:14px 0 0}

      .oc-media{display:flex; flex-direction:column; align-items:center;
        justify-content:flex-start; min-height:0;}
      /* The packer stands away from the screen, so the picture and its count are
         the two things that must read at a distance. Both get a hard border and
         a size well beyond normal UI scale. */
      /* Sized by the picture, capped by the space.
         flex:1 stretched the BORDER to full height, so a wide, short product
         (a 500mm 4-outlet bar) sat in a tall box of white. flex:0 1 auto keeps
         the picture's own shape and max-height stops it overflowing. */
      .oc-media img{flex:0 1 auto; min-height:0; max-height:100%;
        width:auto; max-width:min(760px,40vw); object-fit:contain;
        background:var(--card); border:3px solid var(--ink); border-radius:8px;
        padding:10px; cursor:zoom-in; display:block;}
      .oc-media img:hover{border-color:var(--accent)}

      /* Count badge: a solid block, not a number floating in space. */
      .oc-qty{display:inline-flex; align-items:center; justify-content:center; gap:7px;
        margin-top:12px; padding:clamp(6px,1.1vh,12px) clamp(20px,2.4vw,34px); border-radius:10px;
        background:var(--accent); color:#fff; box-shadow:0 2px 6px rgba(15,110,118,.28);
        font-variant-numeric:tabular-nums; line-height:1;}
      .oc-qty-x{font-size:clamp(24px,3.4vh,40px); font-weight:400; opacity:.72}
      #mainQty{font-size:clamp(38px,6.6vh,76px); font-weight:800; letter-spacing:-.04em}
      .oc-qty-cap{font-size:13px; letter-spacing:.12em; text-transform:uppercase;
        color:var(--ink-2); margin-top:6px; font-weight:600}

      .oc-price{font-size:clamp(21px,2.8vh,27px); font-weight:650; letter-spacing:-.02em;
        margin:0 0 10px; font-variant-numeric:tabular-nums}
      .oc-cust{font-size:15px; color:var(--ink-2); margin:0 0 6px; line-height:1.5}
      .oc-post{font-family:var(--mono); font-size:clamp(19px,2.6vh,24px); font-weight:600; letter-spacing:.02em; margin:0}
      .oc-note{margin:10px 0 0; padding:10px 13px; font-size:15px; line-height:1.4;
        background:var(--alert-soft); border-left:4px solid var(--alert); border-radius:4px;}
      .oc-note-lab{display:block; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
        color:var(--alert); margin-bottom:3px; font-weight:600;}
      /* padding-top is the gap BETWEEN the separator line and the SKU row. At
         10px the quantity box and the SKU string sat tight under the line; the
         packer reads this row from a distance, so it needs air above it. */
      .oc-foot{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 18px;
        flex:none; margin-top:14px; padding-top:24px; border-top:1px solid var(--line);}
      .oc-foot-qty{font-size:clamp(20px,2.8vh,30px); font-weight:700; letter-spacing:-.02em;
        font-variant-numeric:tabular-nums; background:var(--sunk); border:2px solid var(--line-2);
        border-radius:9px; padding:5px 20px;}
      .oc-foot-sku{font-family:var(--mono); font-size:13.5px; color:var(--ink-3); word-break:break-all}

      #zoomOverlay{display:none; position:fixed; inset:0; z-index:10000;
        background:rgba(20,28,36,.86); padding:52px 26px 34px; align-items:center; justify-content:center;}
      #zoomOverlay.open{display:flex}
      #zoomBox{position:relative; max-width:min(1100px,94vw); max-height:88vh}
      #zoomOverlay img{max-width:100%; max-height:82vh; object-fit:contain; display:block;
        background:#fff; border-radius:var(--r); padding:12px;}
      #zoomClose{position:absolute; top:-42px; right:0; background:#fff; color:var(--ink);
        border:0; border-radius:5px; padding:8px 16px; font-size:13.5px; font-weight:600; cursor:pointer;}
      #zoomClose:hover{background:var(--sunk)}
      #zoomHint{position:absolute; bottom:-28px; left:0; right:0; text-align:center;
        color:rgba(255,255,255,.72); font-size:12px;}

      #heldRows{flex:none}
      #heldRows:empty{display:none}
      .held-row{padding:9px 13px; margin:4px 0; background:var(--card); border:1px solid var(--line);
        border-radius:5px; font-size:14px; color:var(--ink-2)}

      @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

      /* ---- additions for the standalone build ---- */
      .drop{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:24px}
      .drop-in{max-width:640px; text-align:center; background:var(--card); border:2px dashed var(--line-2);
        border-radius:10px; padding:44px 40px}
      .drop-in.over{border-color:var(--accent); background:var(--accent-soft)}
      .drop h1{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0 0 8px}
      .drop p{color:var(--ink-2); margin:0 0 20px; font-size:15.5px}
      .drop .hint{font-size:13.5px; color:var(--ink-3); margin-top:16px}
      .file-btn{display:inline-flex; align-items:center; gap:8px; background:var(--accent); color:#fff;
        border:0; border-radius:6px; padding:12px 22px; font-size:15.5px; font-weight:600; cursor:pointer}
      .file-btn:hover{background:var(--accent-ink)}
      input[type=file]{display:none}

      /* order-entry panel: the three fields the pack list never carries */
      .entry{flex:none; display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 14px;
        background:var(--card); border:1px solid var(--line); border-left:3px solid var(--partial-line, #C9871F);
        border-radius:var(--r); padding:9px 16px;}
      .entry .field{flex:1 1 190px}
      .entry input{font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--card);
        border:1px solid var(--line-2); border-radius:5px; padding:7px 10px; width:100%}
      .entry input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
      .entry .saved{font-size:13px; color:var(--ok); font-weight:600; opacity:0; transition:opacity .2s}
      .entry .saved.on{opacity:1}
      /* flex:1 stretched this to the full panel height, leaving a large empty
         area under the last collection card. It now hugs its content. */
      .collection{flex:0 1 auto; align-self:flex-start; min-height:0; overflow:auto; background:var(--card);
        border:2px solid var(--accent); border-radius:var(--r); padding:18px 22px}
      .coll-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px}
      .coll-title{font-size:24px; font-weight:700; letter-spacing:-.02em; color:var(--accent-ink)}
      .coll-count{font-family:var(--mono); font-size:15px; color:var(--ink-2)}
      .coll-grid{display:flex; flex-wrap:wrap; gap:14px}
      .coll-card{flex:0 0 210px; border:1px solid var(--line); border-radius:8px; padding:11px; position:relative}
      .coll-card img{width:100%; height:130px; object-fit:contain; display:block; background:var(--card)}
      .coll-badge{position:absolute; top:4px; right:4px; min-width:38px; height:38px; padding:0 9px;
        border-radius:99px; background:var(--accent); color:#fff; font-size:20px; font-weight:700;
        display:flex; align-items:center; justify-content:center}
      .coll-sku{font-family:var(--mono); font-size:14px; font-weight:600; margin-top:9px; word-break:break-all}
      .coll-meta{font-size:14px; color:var(--ink-2); margin-top:3px}
      .coll-for{font-size:12.5px; color:var(--ink-3); margin-top:5px}
      .coll-note{margin-top:14px; font-size:15px; color:var(--ink-2)}
</style>
</head>
<body>

<!-- ============ 1. load a pack list ============ -->
<div class="shell" id="loadScreen">
  <div class="drop">
    <div class="drop-in" id="dropZone">
      <h1>Speak Tool</h1>
      <p>Open the pack list you want to pack. Nothing is written to a spreadsheet.</p>
      <button type="button" class="file-btn" id="pickBtn"><span class="ico">&#128193;</span>Choose pack list</button>
      <input type="file" id="fileInput" accept=".html,.htm" multiple>
      <p class="hint">Or drag the saved pack list here. You can open more than one at a time.</p>
      <p class="hint" id="loadMsg"></p>
    </div>
  </div>
</div>

<!-- ============ 2. pack ============ -->
<div class="shell" id="packScreen" style="display:none">

  <div class="topbar">
    <div class="pos">
      <span class="pos-row" id="rowCounter">Order 1</span>
      <span class="pos-item" id="itemCounter">Item 1 of 1</span>
    </div>
    <div class="clocks">
      <div class="clock"><span class="clock-lab">This order</span><span class="clock-val" id="rowTimeTracker">00:00:00</span></div>
      <div class="clock"><span class="clock-lab">Total</span><span class="clock-val" id="totalTimeTracker">00:00:00</span></div>
    </div>
    <div class="audio">
      <div class="field"><label for="langSelect">Language</label><select id="langSelect"></select></div>
      <div class="field"><label for="voiceSelect">Voice</label><select id="voiceSelect"></select></div>
      <div class="field"><label>Speed</label>
        <div class="seg" id="rateSeg">
          <button type="button" data-rate="0.6">Slow</button>
          <button type="button" data-rate="0.7" aria-pressed="true">Normal</button>
          <button type="button" data-rate="1.2">Fast</button>
          <button type="button" data-rate="1.5">Faster</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button type="button" onclick="nav('restart')"><span class="ico">&#128257;</span>Restart</button>
    <button type="button" onclick="nav('back')"><span class="ico">&#9198;</span>Back</button>
    <button type="button" onclick="nav('postcode')"><span class="ico">&#128205;</span>Postcode</button>
    <button type="button" onclick="togglePause()" id="pauseBtn"><span class="ico">&#9208;</span>Pause</button>
    <button type="button" onclick="nav('repeat')"><span class="ico">&#128260;</span>Repeat</button>
    <button type="button" class="primary" onclick="nav('next')"><span class="ico">&#9197;</span>Next</button>
    <div class="spacer"></div>
    <div class="mic-wrap">
      <button type="button" onclick="toggleMic()" id="micBtn"><span class="ico">&#127908;</span>Mic</button>
      <div id="micIndicator" class="mic-processing"><span class="mic-dot"></span><span id="micText">Starting</span></div>
    </div>
    <button type="button" onclick="location.reload()"><span class="ico">&#128193;</span>New pack list</button>
  </div>

  <!-- The three fields the pack list never carries. They exist only because the
       team types them in, so this tool owns them now instead of a spreadsheet. -->
  <div class="entry">
    <div class="field"><label for="fQr">Instruction QR</label><input id="fQr" placeholder="e.g. Instruction QR Available"></div>
    <div class="field"><label for="fNote">Send order instruction</label><input id="fNote" placeholder="e.g. Commercial Invoice add"></div>
    <div class="field"><label for="fStatus">Status</label><input id="fStatus" placeholder="e.g. Hold"></div>
    <span class="saved" id="savedMsg">Saved</span>
  </div>

  <div id="spokenText"></div>
  <div class="combo-images" id="comboImagesContainer"></div>
  <div id="display"></div>
</div>

<div id="zoomOverlay">
  <div id="zoomBox">
    <button type="button" id="zoomClose" onclick="hideZoom()">&times; Close</button>
    <img id="zoomImg" src="" alt="Product image, enlarged">
    <div id="zoomHint">Click the background or press Esc to close</div>
  </div>
</div>

<script src="reference-data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
