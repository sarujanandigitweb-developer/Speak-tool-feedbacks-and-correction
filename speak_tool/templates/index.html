<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload HTML Files</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #fff3e0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    h1 {
      color: #00796b;
      margin-bottom: 20px;
    }
    input[type='file'] {
      width: 100%;
      padding: 10px;
      border: 2px dashed #00796b;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #f1f8e9;
    }
    button {
      background: #00796b;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #004d40;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload HTML Files</h1>
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" multiple required />
      <br />
      <button type="submit">Upload and Export</button>
    </form>
  </div>
</body>
</html>
